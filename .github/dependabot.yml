version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Matches min-release-age in .npmrc
    cooldown:
      default-days: 7
    # the Sync upstream workflow moves these with the workers-sdk submodule, since they must match the code bundled from it
    ignore:
      - dependency-name: wrangler
      - dependency-name: miniflare
      - dependency-name: unenv
      - dependency-name: '@cloudflare/unenv-preset'
      - dependency-name: '@cloudflare/containers-shared'
      - dependency-name: toucan-js
      - dependency-name: mime
      - dependency-name: ignore
      # typescript-eslint and @nodecraft/eslint-config don't support TypeScript 7 yet
      - dependency-name: typescript
        versions: ['>=7']
    groups:
      rspack:
        patterns:
          - '@rspack/*'
  # Keeps the actions and their pins in .github/workflows/actions.lock current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
